<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>芽生｜入口</title>
  <link rel="stylesheet" href="style.css">
</head>

<body class="entrance-page">

  <main class="entrance">
    <button id="welcomePlate" class="welcome-plate" aria-label="部屋に入る">
      WELCOME
    </button>

    <p class="entrance-note">2回タップすると入れます</p>
  </main>

  <script>
    const plate = document.getElementById("welcomePlate");

    let tapCount = 0;
    let tapTimer;

    plate.addEventListener("click", () => {
      tapCount++;

      plate.classList.add("swing");

      setTimeout(() => {
        plate.classList.remove("swing");
      }, 500);

      clearTimeout(tapTimer);

      if (tapCount >= 2) {
        window.location.href = "room.html";
        return;
      }

      tapTimer = setTimeout(() => {
        tapCount = 0;
      }, 700);
    });
  </script>

</body>
</html>
